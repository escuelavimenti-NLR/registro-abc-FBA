name: Mantener Supabase activo

on:
  schedule:
    # Lunes y jueves a las 14:00 UTC (10:00 a.m. en Puerto Rico)
    - cron: '0 14 * * 1,4'
  # Permite correrlo manualmente desde la pestaña Actions
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la tabla estudiantes
        env:
          SUPABASE_URL: https://tvbhlyayusurnrggquge.supabase.co
          SUPABASE_KEY: sb_publishable_b2WmDetZSeY0Uyo7G96A1A_1ES-trNs
        run: |
          curl --fail --silent --show-error \
            -o /dev/null \
            -w "Respuesta de Supabase: HTTP %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/estudiantes?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY"
